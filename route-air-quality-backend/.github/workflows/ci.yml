name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: test_token
          INFLUX_ORG: test_org
          INFLUX_BUCKET: test_bucket
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: test_secret_key_for_ci_only
          ML_MODEL_PATH: nonexistent/model
          ML_SCALER_PATH: nonexistent/scaler.pkl
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ML artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
          path: ml/
      - name: Build Docker image
        run: docker build -t route-air-quality-backend:${{ github.sha }} .
