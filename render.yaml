databases:
  - name: airaware-db
    databaseName: air_quality
    user: aq_user
    plan: free # or standard

services:
  # Managed Redis Cache
  - type: redis
    name: airaware-cache
    plan: free # or starter
    ipAllowList: [] # internal only

  # InfluxDB as a Private Service running official Docker image
  - type: pserv
    name: airaware-influx
    env: image
    image:
      url: docker.io/library/influxdb:2.7-alpine
    plan: starter
    disk:
      name: influx-data
      mountPath: /var/lib/influxdb2
      sizeGB: 1
    envVars:
      - key: DOCKER_INFLUXDB_INIT_MODE
        value: setup
      - key: DOCKER_INFLUXDB_INIT_USERNAME
        value: admin
      - key: DOCKER_INFLUXDB_INIT_PASSWORD
        generateValue: true
      - key: DOCKER_INFLUXDB_INIT_ORG
        value: airquality
      - key: DOCKER_INFLUXDB_INIT_BUCKET
        value: air_quality
      - key: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
        generateValue: true

  # FastAPI Backend Web Service
  - type: web
    name: airaware-api
    env: docker
    rootDir: route-air-quality-backend
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      
      # Postgres Connection
      - key: POSTGRES_USER
        fromDatabase:
          name: airaware-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: airaware-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: airaware-db
          property: database
      - key: POSTGRES_HOST
        fromDatabase:
          name: airaware-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: airaware-db
          property: port
          
      # Redis Connection
      - key: REDIS_HOST
        fromService:
          type: redis
          name: airaware-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: airaware-cache
          property: port
          
      # InfluxDB Connection
      - key: INFLUX_URL
        # In Render, private services are reachable via their service name as the host
        value: http://airaware-influx:8086
      - key: INFLUX_ORG
        value: airquality
      - key: INFLUX_BUCKET
        value: air_quality
      - key: INFLUX_TOKEN
        fromService:
          type: pserv
          name: airaware-influx
          envVarKey: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
      
      # Application Security
      - key: JWT_SECRET_KEY
        generateValue: true
        
      # Third Party API Keys (To be filled in the Render Dashboard)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: WAQI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CPCB_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
